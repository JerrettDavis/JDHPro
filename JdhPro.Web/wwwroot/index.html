<!DOCTYPE html>
<html lang="en" data-theme="professional">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDH Productions | Technical Engineering Excellence</title>
    <base href="/" />
    <script>
        // Restore deep links when GitHub Pages routes through 404.html.
        try {
            const redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect !== location.pathname + location.search + location.hash) {
                history.replaceState(null, null, redirect);
            }
        } catch {}
    </script>
    <script src="js/theme.js"></script>
    <link rel="icon" type="image/png" sizes="256x256" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.min.css" />
    <link rel="stylesheet" href="css/brand.css" />
    <script type="importmap"></script>
</head>
<body>
    <div class="blazor-loading-overlay" role="status">
        <div>
            <strong>JDH Productions</strong>
            <div class="brand-muted">Loading website…</div>
            <div class="brand-loader-track" aria-hidden="true"></div>
        </div>
    </div>
    <div id="app"></div>
    <div id="blazor-error-ui" role="alert">
        An error occurred while loading the website. <a href="" class="reload">Reload</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({ applicationUrl: document.querySelector('base').getAttribute('href') })
            .then(() => document.body.classList.add('blazor-loaded'))
            .catch(error => {
                console.error('Blazor start error:', error);
                document.body.classList.add('blazor-loaded');
                document.getElementById('blazor-error-ui').style.display = 'block';
            });
    </script>
</body>
</html>
